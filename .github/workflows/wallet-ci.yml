name: Wallet checks
on:
  pull_request:
    paths: ['wallet/**', '.github/workflows/wallet-ci.yml']
  push:
    paths: ['wallet/**', '.github/workflows/wallet-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wallet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Tests, build and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wallet
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: wallet/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run wallet tests
        run: npm test
      - name: Build and scan release
        run: npm run build
      - name: Check dependency advisories
        run: npm audit --audit-level=moderate
  container:
    name: Caddy container and hosting checks
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: docker build -t forma-wallet-ci ./wallet
      - run: docker run --rm -e WALLET_DOMAIN=wallet.example.invalid forma-wallet-ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker run -d --name forma-wallet-smoke --read-only --tmpfs /tmp --tmpfs /data --tmpfs /config --cap-drop ALL --cap-add NET_BIND_SERVICE --security-opt no-new-privileges -e WALLET_DOMAIN=http://:8080 -p 127.0.0.1:9080:8080 forma-wallet-ci
      - name: Wait for local container
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:9080/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: node wallet/scripts/check-host.mjs http://127.0.0.1:9080
      - if: always()
        run: docker rm -f forma-wallet-smoke || true
