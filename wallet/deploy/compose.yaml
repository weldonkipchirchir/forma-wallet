services:
  wallet:
    build:
      context: ..
    environment:
      WALLET_DOMAIN: ${WALLET_DOMAIN:?Set a reviewed public wallet hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - wallet_tls:/data
      - wallet_config:/config
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
volumes:
  wallet_tls:
  wallet_config:
